<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <title>INSA KMA Fields</title>
    <!--
      GitHub Pages ne zna za prave rute (npr. /sadnice) i vraća 404 na
      direktan pristup ili refresh. Ovaj skript enkoduje trenutnu putanju
      u query string i redirektuje na /index.html?/putanja — standardni
      "spa-github-pages" obrazac (rafgraph/spa-github-pages).
      pathSegmentsToKeep = 0 jer custom domen (www.insakma.com) servira
      sajt sa korena, bez /KMASAJT/ podputanje.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
