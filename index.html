    <!--
      GitHub Pages SPA fallback (spa-github-pages obrazac): public/404.html
      enkoduje pravu putanju u query string i redirektuje na
      /index.html?/putanja. Ovaj skript to dekodira nazad u pravu putanju
      preko history.replaceState PRE nego što se React app mount-uje, da
      router odmah vidi ispravnu rutu.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
